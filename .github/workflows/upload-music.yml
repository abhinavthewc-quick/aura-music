name: Upload Music to Hugging Face Bucket

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'YouTube / YouTube Music URLs (one per line)'
        required: true
        type: string
      meta:
        description: 'Optional JSON metadata for manifest.json ([{id,title,artist,album}])'
        required: false
        default: ''
        type: string
      more_urls:
        description: 'Remaining URLs for the chain (queued by the previous run)'
        required: false
        default: ''
        type: string
      more_meta:
        description: 'Metadata for more_urls'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: upload-music
  cancel-in-progress: false

jobs:
  download-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap tools & workspace
        env:
          URLS: ${{ inputs.urls }}
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          T_ALL=$(date +%s%N)

          # Everything network-bound runs in parallel: yt-dlp binary,
          # static ffmpeg (download + extract chained), hf/mutagen pip install.
          mkdir -p /tmp/ffkit
          curl -fsSL --retry 3 -o /tmp/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" &
          PID_YT=$!
          (
            set +e
            if curl -fsSL --retry 3 \
                "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
                | tar -xJf - -C /tmp/ffkit; then exit 0; fi
            echo "primary ffmpeg source failed - falling back to GitHub build" >&2
            curl -fsSL --retry 3 \
              "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz" \
              | tar -xJf - -C /tmp/ffkit
          ) &
          PID_FF=$!
          python -m pip install -q huggingface_hub mutagen &
          PID_PIP=$!

          # Workspace + cookies (local I/O while network runs).
          mkdir -p downloads scripts
          printf '%s\n' "$URLS" > urls.txt
          grep -E 'https?://' urls.txt > urls.clean.txt || true
          mv urls.clean.txt urls.txt
          echo "Queued URLs:" && cat urls.txt
          if [ -n "${YT_COOKIES:-}" ]; then
            printf '%s' "$YT_COOKIES" > cookies.txt
            echo "cookies.txt restored from repo secret."
          else
            echo "No YOUTUBE_COOKIES secret set - downloading without cookies."
          fi

          # The job only needs two files from the repo - fetch them at the
          # exact run SHA instead of a full checkout (fast + race-free).
          for SCRIPT in fix_metadata.py build_manifest.py; do
            curl -fsSL \
                "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/$SCRIPT" \
                -o "scripts/$SCRIPT" \
              || {
                curl -fsSL -H "Authorization: Bearer $GH_API_TOKEN" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/scripts/$SCRIPT?ref=$GITHUB_SHA" \
                  | python -c 'import sys,json,base64; sys.stdout.write(base64.b64decode(json.load(sys.stdin)["content"]).decode())' \
                  > "scripts/$SCRIPT"
              }
          done

          wait "$PID_YT"  || { echo "::error::yt-dlp download failed";  exit 1; }
          wait "$PID_FF"  || { echo "::error::ffmpeg install failed";    exit 1; }
          wait "$PID_PIP" || { echo "::error::pip install failed";       exit 1; }

          FF=$(find /tmp/ffkit -type f -name ffmpeg  | head -1 || :)
          FP=$(find /tmp/ffkit -type f -name ffprobe | head -1 || :)
          if [ -z "$FF" ] || [ -z "$FP" ]; then
            echo "::error::ffmpeg/ffprobe not found after extraction"
            exit 1
          fi
          sudo install -m 755 /tmp/yt-dlp "$FF" "$FP" /usr/local/bin/

          yt-dlp --version
          node --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          hf --help >/dev/null && echo "hf CLI ok"
          python -c "import mutagen; print('mutagen', mutagen.version_string)"
          test -s scripts/fix_metadata.py && echo "fix_metadata.py ok"
          test -s scripts/build_manifest.py && echo "build_manifest.py ok"
          echo "bootstrap wall: $(( ($(date +%s%N) - T_ALL) / 1000000 ))ms"

      - name: Download audio (format 251 - webm/Opus) with metadata
        run: |
          ARGS=(
            --no-progress
            --newline
            --retries 5
            --fragment-retries 5
            --ignore-errors
            --no-playlist
            --js-runtimes node
            -f "251/bestaudio[ext=webm]/bestaudio"
            --write-info-json
            --embed-metadata
            --remux-video opus
            --embed-thumbnail
            --write-thumbnail
            --output "downloads/%(uploader)s - %(title)s [%(id)s].%(ext)s"
          )
          if [ -f cookies.txt ]; then ARGS+=(--cookies cookies.txt); fi
          RC=0
          yt-dlp "${ARGS[@]}" -a urls.txt || RC=$?
          echo "yt-dlp exit code: $RC (non-zero is OK as long as some audio landed)"

          audio_files() {
            find downloads -type f \( -name '*.opus' -o -name '*.webm' -o -name '*.m4a' -o -name '*.mp3' \) \
              ! -name '*.temp.*' ! -name '*.part' ! -name '*.ytdl'
          }
          failed_urls() {
            local id url
            while IFS= read -r url; do
              id=$(printf '%s' "$url" | grep -oE '[?&]v=[A-Za-z0-9_-]{11}' | head -n1 | cut -d= -f2)
              if [ -z "$id" ]; then continue; fi
              if ! audio_files | grep -qF "[$id]"; then
                printf '%s\n' "$url"
              fi
            done < urls.txt
            return 0
          }

          failed_urls > failed.txt
          if [ -s failed.txt ]; then
            N=$(wc -l < failed.txt)
            echo "$N URL(s) missed in pass 1 - retrying with forced fallback clients..."
            for CLIENT in visionos tv_embedded; do
              if [ ! -s failed.txt ]; then break; fi
              echo "Trying player_client=$CLIENT ..."
              yt-dlp "${ARGS[@]}" --extractor-args "youtube:player_client=$CLIENT" -a failed.txt || true
              failed_urls > failed.txt
            done
          fi

          if [ -s failed.txt ]; then
            echo "::warning::Some queued URLs could not be downloaded - see the Job summary."
            sed 's/^/not downloaded: /' failed.txt
          fi

          COUNT=$(audio_files | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No audio files were downloaded - check URLs, cookies, or yt-dlp errors above."
            sed 's/^/  - /' failed.txt || true
            exit 1
          fi
          echo "$COUNT audio file(s) ready."

          python scripts/fix_metadata.py downloads

          # marker for the chain step: if this is missing, the run died before
          # downloading anything (bad secret, network, yt-dlp gone) and the
          # rest of the chain should stop instead of burning every batch.
          touch .chain-ok

      - name: Upload to Hugging Face storage bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET_ID: ${{ secrets.HF_BUCKET_ID }}
        run: |
          : "${HF_TOKEN:?Secret HF_TOKEN is not set - configure it from the admin panel.}"
          : "${HF_BUCKET_ID:?Secret HF_BUCKET_ID is not set - configure it from the admin panel.}"
          hf buckets create "$HF_BUCKET_ID" --private --exist-ok
          hf buckets sync downloads/ "hf://buckets/$HF_BUCKET_ID" --exclude "*.info.json" --exclude "*.part" --exclude "*.temp.*"

      - name: Build & upload manifest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET_ID: ${{ secrets.HF_BUCKET_ID }}
          META: ${{ inputs.meta }}
        run: |
          : "${HF_BUCKET_ID:?Secret HF_BUCKET_ID is not set}"
          test -s scripts/build_manifest.py || { echo "::error::build_manifest.py missing"; exit 1; }
          python scripts/build_manifest.py downloads

      # GitHub keeps only ONE pending run per concurrency group, so the
      # batches cannot all be dispatched up front (each new one cancels the
      # waiting one). Instead every run hands the leftovers to the next run as
      # it finishes — one click, whole queue, no browser tab required.
      - name: Queue the next batch (chain)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          MORE_URLS: ${{ inputs.more_urls }}
          MORE_META: ${{ inputs.more_meta }}
          MAX_PER_RUN: '25'
        run: |
          set -euo pipefail
          if [ -z "${MORE_URLS//[[:space:]]/}" ]; then
            echo "chain complete - nothing left to queue"
            exit 0
          fi
          if [ ! -f .chain-ok ]; then
            echo "::warning::this run never reached the download step - stopping the chain so the rest stays queued"
            exit 0
          fi

          python3 - <<'PY'
          import json, os
          urls = [l.strip() for l in os.environ['MORE_URLS'].splitlines() if l.strip()]
          try:
              meta = json.loads(os.environ.get('MORE_META') or '[]')
          except Exception:
              meta = []
          n = int(os.environ['MAX_PER_RUN'])
          batch, rest = urls[:n], urls[n:]
          def ids(seq):
              out = set()
              for u in seq:
                  q = u.split('v=')[-1].split('&')[0].strip()
                  if len(q) == 11:
                      out.add(q)
              return out
          keep = [m for m in meta if isinstance(m, dict) and m.get('id') in ids(batch)]
          left = [m for m in meta if isinstance(m, dict) and m.get('id') in ids(rest)]
          json.dump(
              {
                  'ref': 'main',
                  'inputs': {
                      'urls': '\n'.join(batch),
                      'meta': json.dumps(keep, separators=(',', ':')),
                      'more_urls': '\n'.join(rest),
                      'more_meta': json.dumps(left, separators=(',', ':')),
                  },
              },
              open('.next-batch.json', 'w'),
          )
          print(f"queued {len(batch)} track(s); {len(rest)} left in the chain")
          PY

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/upload-music.yml/dispatches" \
            --input .next-batch.json
          echo "next batch dispatched"

      - name: Job summary
        if: always()
        env:
          HF_BUCKET_ID: ${{ secrets.HF_BUCKET_ID }}
        run: |
          {
            echo "### Uploaded files"
            ls -lh downloads/ 2>/dev/null | grep -vE 'info\.json|total' || echo "(no files)"
            if [ -s failed.txt ]; then
              echo ""
              echo "### Not downloaded (queued but failed - retried with fallback clients)"
              sed 's/^/- /' failed.txt
            fi
            if [ -n "$HF_BUCKET_ID" ]; then
              echo ""
              echo "Bucket: https://huggingface.co/buckets/$HF_BUCKET_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
