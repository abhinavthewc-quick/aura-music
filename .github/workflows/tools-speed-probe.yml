name: Tools Speed Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment facts
        run: |
          . /etc/os-release && echo "os: $PRETTY_NAME"
          echo "ffmpeg preinstalled: $(command -v ffmpeg || echo NO)"
          echo "system python3 -m pip: $(python3 -m pip --version 2>&1 | head -1)"
          echo "pipx: $(pipx --version 2>&1)"
          echo "apt list files: $(ls /var/lib/apt/lists/ 2>/dev/null | wc -l)"
          echo "which python (setup-python): $(command -v python) $(python --version)"

      - name: Benchmark tool bootstrap
        run: |
          set -uo pipefail
          ms() { echo $(( ($(date +%s%N) - $1) / 1000000 )); }
          T0=$(date +%s%N)
          curl -fsSL --retry 2 -o /tmp/yt-dlp-bin "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" &
          P1=$!
          curl -fsSL --retry 2 -o /tmp/ffmpeg-jv.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" &
          P2=$!
          curl -fsSL --retry 2 -o /tmp/ffmpeg-gh.tar.xz "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz" &
          P3=$!
          TPIP=$(date +%s%N)
          python -m pip install -q huggingface_hub mutagen
          echo "pip install huggingface_hub+mutagen: $(ms $TPIP) ms"
          wait $P1; echo "yt-dlp_linux download: $(ms $T0) ms ($(stat -c%s /tmp/yt-dlp-bin) bytes)"
          wait $P2; echo "johnvansickle download: $(ms $T0) ms ($(stat -c%s /tmp/ffmpeg-jv.tar.xz) bytes)"
          wait $P3; echo "yt-dlp/FFmpeg-Builds download: $(ms $T0) ms ($(stat -c%s /tmp/ffmpeg-gh.tar.xz) bytes)"
          echo "total parallel bootstrap wall: $(ms $T0) ms"

          TX=$(date +%s%N); mkdir -p /tmp/jv && tar -xJf /tmp/ffmpeg-jv.tar.xz -C /tmp/jv && echo "jv extract: $(ms $TX) ms ($(du -sh /tmp/jv | cut -f1))"
          TX=$(date +%s%N); mkdir -p /tmp/gh && tar -xJf /tmp/ffmpeg-gh.tar.xz -C /tmp/gh && echo "gh extract all: $(ms $TX) ms ($(du -sh /tmp/gh | cut -f1))"
          TX=$(date +%s%N); mkdir -p /tmp/gh2 && tar -xJf /tmp/ffmpeg-gh.tar.xz -C /tmp/gh2 --wildcards '*/ffmpeg' '*/ffprobe' && echo "gh extract ffmpeg+ffprobe only: $(ms $TX) ms"

          chmod +x /tmp/yt-dlp-bin
          echo "yt-dlp: $(/tmp/yt-dlp-bin --version)"
          JVFF=$(find /tmp/jv -name ffmpeg); GHFF=$(find /tmp/gh -name ffmpeg)
          echo "jv ffmpeg: $($JVFF -version | head -1)"
          echo "gh ffmpeg: $($GHFF -version | head -1)"
          echo "hf: $(python -m huggingface_hub.cli --help >/dev/null 2>&1 && echo module-ok); $(hf --version 2>&1 || python -c 'import huggingface_hub; print(huggingface_hub.__version__)')"

      - name: Benchmark candidate bootstrap (winners only)
        run: |
          ms() { echo $(( ($(date +%s%N) - $1) / 1000000 )); }
          # simulate the real single "bootstrap" step wall time with the best candidates re-run cold
          T0=$(date +%s%N)
          curl -fsSL --retry 2 -o /tmp/y1 "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" &
          curl -fsSL --retry 2 -o /tmp/f1 "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" &
          python -m pip install -q --force-reinstall huggingface_hub mutagen &
          wait
          echo "cold parallel (jv variant): $(ms $T0) ms"
